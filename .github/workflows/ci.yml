name: verify

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Typecheck, test, and build
        run: npm run check
      - name: Create immutable package artifact
        run: npm pack --ignore-scripts --pack-destination dist
      - name: Upload immutable package artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        with:
          name: health-intelligence-plugin-${{ github.sha }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14
