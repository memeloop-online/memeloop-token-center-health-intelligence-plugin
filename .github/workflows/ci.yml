name: verify

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Verify typed API and fixtures
        run: npm run check
      - name: Check out the current MTC host contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: memeloop-online/memeloop-token-center
          ref: 4c3cb9acb06f86cfdcdfd319b1cfcf1cd924fbdc
          path: mtc-core
          persist-credentials: false
      - name: Check out the pinned installer contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: memeloop-online/memeloop-token-center
          ref: 4c3cb9acb06f86cfdcdfd319b1cfcf1cd924fbdc
          path: mtc-installer-contract
          fetch-depth: 0
          persist-credentials: false
      - name: Verify manifest against the host and installer contracts
        run: |
          test "$(node -p "require('./release/installer-trust.json').installer_source_revision")" = \
            "$(git -C "$GITHUB_WORKSPACE/mtc-installer-contract" rev-parse HEAD)"
          minimum_revision=$(node -p "require('./release/installer-trust.json').minimum_installer_contract_revision")
          git -C "$GITHUB_WORKSPACE/mtc-installer-contract" merge-base --is-ancestor \
            "$minimum_revision" \
            4c3cb9acb06f86cfdcdfd319b1cfcf1cd924fbdc
          node scripts/verify-static.mjs \
            "$GITHUB_WORKSPACE/mtc-core" \
            "$GITHUB_WORKSPACE/mtc-installer-contract"
      - name: Create review package
        run: npm pack --ignore-scripts --pack-destination dist
      - name: Upload review package
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: mtc-health-intelligence-${{ github.sha }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14
