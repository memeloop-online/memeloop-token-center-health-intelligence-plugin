name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Verify repository and manifest contracts
        run: node scripts/verify-static.mjs
      - name: Checkout the pinned MTC host contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: memeloop-online/memeloop-token-center
          ref: aca14f12a8522b817b8463c237ae6d6c5f04cb76
          path: mtc-core
          persist-credentials: false
      - name: Verify pinned WIT and group-routing-v2 schema support
        run: node scripts/verify-static.mjs "$GITHUB_WORKSPACE/mtc-core"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
          components: rustfmt
      - name: Test and build the locked component
        env:
          CARGO_BUILD_JOBS: 2
          CARGO_PROFILE_TEST_DEBUG: 0
        run: |
          cargo fmt --check
          cargo test --locked
          cargo build --locked --release --target wasm32-unknown-unknown
      - name: Install reviewed wasm-tools binary
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-tools"
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.252.0/wasm-tools-1.252.0-x86_64-linux.tar.gz \
            --output "$RUNNER_TEMP/wasm-tools.tar.gz"
          echo '097b1181d5b2bc3f2ebc44b4e72edf18308902023f1f1483a1a7dc1268ea988d  '"$RUNNER_TEMP/wasm-tools.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/wasm-tools.tar.gz" -C "$RUNNER_TEMP/plugin-tools" --strip-components=1
      - name: Assemble and validate the Wasm component package
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-package"
          "$RUNNER_TEMP/plugin-tools/wasm-tools" component new \
            target/wasm32-unknown-unknown/release/mtc_transient_health.wasm \
            -o "$RUNNER_TEMP/plugin-package/plugin.wasm"
          "$RUNNER_TEMP/plugin-tools/wasm-tools" validate --features component-model \
            "$RUNNER_TEMP/plugin-package/plugin.wasm"
          cp plugin.json README.md "$RUNNER_TEMP/plugin-package/"
      - name: Preserve the review package
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: mtc-transient-health-review-${{ github.sha }}
          path: |
            ${{ runner.temp }}/plugin-package/plugin.json
            ${{ runner.temp }}/plugin-package/plugin.wasm
            ${{ runner.temp }}/plugin-package/README.md
          if-no-files-found: error
          retention-days: 14
